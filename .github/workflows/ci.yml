# CI 四道门（12 §5 / 09 §1.3 / 16 §6）：
# static-checks → (unit ∥ storybook) → e2e → build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  # 第 1 道门：最快最便宜的检查最先失败
  static-checks:
    name: static-checks (typecheck · lint · prettier · stories · mock-contracts · openapi-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - name: openapi 契约漂移检测（10 §2.1）
        run: git diff --exit-code src/types/generated/
      - run: pnpm typecheck
      - name: lint（boundaries + 防绕过，--max-warnings=0）
        run: pnpm lint
      - run: pnpm format:check
      - name: story 覆盖强制（12 §2.5）
        run: pnpm check:stories
      - name: 替身响应锚定契约类型（29 §3.2 第三条）
        run: pnpm check:mock-contracts

  # 第 2 道门（并行）：单测
  unit-tests:
    name: unit-tests (vitest)
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: pnpm test

  # 第 2 道门（并行）：Storybook 交互/a11y 测试
  storybook-tests:
    name: storybook-tests (vitest browser)
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook

  # 第 3 道门：E2E（最重，L1+L2 过后再跑）
  e2e-tests:
    name: e2e-tests (playwright)
    needs: [unit-tests, storybook-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 第 4 道门：构建
  build:
    name: build (next build)
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: pnpm build
